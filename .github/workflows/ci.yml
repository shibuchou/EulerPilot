name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  agent-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo add-apt-repository -y universe || true
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            llvm \
            pkg-config \
            libbpf-dev \
            libelf-dev \
            zlib1g-dev \
            libyaml-cpp-dev
          if apt-cache show bpftool >/dev/null 2>&1; then
            sudo apt-get install -y bpftool
          else
            sudo apt-get install -y linux-tools-common linux-tools-generic || true
            if ! command -v bpftool >/dev/null 2>&1; then
              candidate="$(find /usr/lib -path '*/bpftool' -type f 2>/dev/null | sort -V | tail -1 || true)"
              if [ -n "$candidate" ]; then
                sudo ln -sf "$candidate" /usr/local/bin/bpftool
              fi
            fi
          fi
          bpftool version

      - name: Build unit tests
        run: make unit-tests

      - name: Build agent
        run: make agent

      - name: Build observer helper
        run: make observer

      - name: Build eBPF extension objects
        run: make network-policy network-qos-tc network-xdp security-policy

      - name: Validate default config
        run: ./build/eulerpilot-agent --validate-config configs/agent.yaml

      - name: Validate policy engine config
        run: ./build/eulerpilot-agent --validate-config configs/policy_engine_security_network_resource.yaml

      - name: Run config schema semantic checks
        run: tests/integration/test_config_validation.sh

      - name: Check shell script syntax
        run: find scripts tests bench demo -type f -name '*.sh' -print0 | xargs -0 -r bash -n

  web-console:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web_console/package-lock.json

      - name: Install Web Console dependencies
        working-directory: web_console
        run: npm ci

      - name: Lint Web Console
        working-directory: web_console
        run: npm run lint

      - name: Test Web Console
        working-directory: web_console
        run: npm run test

      - name: Build Web Console
        working-directory: web_console
        run: npm run build
