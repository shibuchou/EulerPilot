schema_version: 2
skills:
- name: resource_control
  kind: runtime
  enabled: true
  config:
    mode: enforce
    controllers:
      cpu:
        max:
          enabled: true
      memory:
        enabled: true
        high:
          enabled: true
        low:
          enabled: true
        max:
          enabled: true
        reclaim:
          enabled: false
      io:
        enabled: true
        device: auto
        weight:
          enabled: true
        max:
          enabled: true
    targets: {}
    profiles:
      latency:
        cpu_max: max
        memory_low: '67108864'
        memory_high: max
        memory_max: max
        io_weight: 'default 100'
        io_max: ''
      batch:
        cpu_max: max
        memory_low: '0'
        memory_high: max
        memory_max: max
        io_weight: 'default 100'
        io_max: ''
      background:
        normal:
          cpu_max: max
          memory_high: max
          io_weight: 'default 100'
          io_max: ''
        pressure:
          cpu_max: '20000 100000'
          memory_high: '134217728'
          memory_low: '0'
          memory_max: max
          memory_reclaim: ''
          io_weight: 'default 50'
          io_max: 'auto rbps=max wbps=1048576'
- name: psi_gate
  kind: runtime
  enabled: true
  config: {}
- name: network_policy
  kind: runtime
  enabled: false
  config:
    mode: audit
    targets:
      demo_cgroup:
        type: cgroup
        path: /sys/fs/cgroup/eulerpilot/demo-net
    rules:
      - name: deny_demo_port
        hook: cgroup_connect4
        target_ref: demo_cgroup
        protocol: tcp
        dst_port: '18080'
        action: deny
- name: network_policy_demo
  kind: runtime
  enabled: false
  config:
    cgroup_path: /sys/fs/cgroup/eulerpilot/demo-net
    dst_port: '18080'
    hook: cgroup_connect4
    mode: enforce
- name: network_qos
  kind: runtime
  enabled: false
  config:
    mode: audit
    targets:
      lab_veth:
        type: netdev
        ifname: ep-veth-qos0
    rules:
      - name: limit_lab_egress
        hook: tc_egress
        target_ref: lab_veth
        protocol: any
        dst_port: '0'
        rate: 1mbit
        burst: 32kb
        latency: 50ms
        action: limit
- name: network_xdp
  kind: runtime
  enabled: false
  config:
    mode: audit
    targets:
      lab_xdp_veth:
        type: netdev
        ifname: ep-veth-xdp0
    rules:
      - name: drop_icmp_lab
        hook: xdp
        target_ref: lab_xdp_veth
        protocol: icmp
        dst_port: '0'
        action: drop
      - name: drop_tcp_probe_lab
        hook: xdp
        target_ref: lab_xdp_veth
        protocol: tcp
        dst_port: '19092'
        action: drop
- name: security_policy
  kind: runtime
  enabled: false
  config:
    mode: audit
    targets:
      demo_secret:
        type: path
        path: /root/EulerPilot/demo/security_policy_demo/secret.txt
        exec_path: /root/EulerPilot/demo/security_policy_demo/deny_exec.sh
    rules:
      - name: deny_demo_secret_open
        hook: lsm_file_open
        target_ref: demo_secret
        action: deny
- name: security_policy_demo
  kind: runtime
  enabled: false
  config:
    hook: lsm_file_open
    mode: enforce
    target_path: /root/EulerPilot/demo/security_policy_demo/secret.txt
    target_exec_path: /root/EulerPilot/demo/security_policy_demo/deny_exec.sh
