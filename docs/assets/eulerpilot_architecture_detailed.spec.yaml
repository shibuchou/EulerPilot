meta:
  profile: engineering-review
  theme: academic-color
  source: generated
  layout: hierarchical
  routing: orthogonal
  title: EulerPilot 分层项目架构图
  description: 面向 openEuler 的自适应资源管控 Agent，覆盖观测、决策、Skills、执行、证据与演示。
  legend: 主链路从业务负载进入内核观测，再到用户态 Agent 决策，最后由 Resource/Network/Security/scx 后端执行并输出证据；虚线表示证据、审计和回滚链路。
modules:
  - id: targets
    label: 业务负载与验证目标
  - id: kernel
    label: openEuler 内核能力层
  - id: bpf
    label: eBPF 观测与 Hook 层
  - id: agent
    label: 用户态 Agent 控制面
  - id: skills
    label: Skills 能力层
  - id: execute
    label: 执行与系统效果层
  - id: evidence
    label: 证据与交付层
nodes:
