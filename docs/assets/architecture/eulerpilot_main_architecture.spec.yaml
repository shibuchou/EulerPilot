meta:
  profile: engineering-review
  theme: academic-color
  source: generated
  layout: horizontal
  routing: rounded
  title: EulerPilot 主架构图
  description: 面向 openEuler 的自适应资源管控 Agent 主运行闭环，覆盖入口、内核观测、Agent 控制核心、Skills、内核执行、安全横切、证据与双环境验证。
  legend: 实线表示运行时数据流、决策流和执行反馈；虚线表示能力检测、安全约束和验证关系。cgroup v2 是稳定资源治理主路径，sched_ext/scx 是比赛核心增强调度路径。
modules:
