  <text x="932.5" y="335" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" dominant-baseline="middle">
<tspan x="932.5" dy="0" font-size="24" font-weight="700" fill="#92400E">自适应决策</tspan>
<tspan x="932.5" dy="30" font-size="17" font-weight="500" fill="#111827">PsiGate</tspan>
<tspan x="932.5" dy="30" font-size="17" font-weight="500" fill="#111827">Policy Engine</tspan>
</text>
</g>
