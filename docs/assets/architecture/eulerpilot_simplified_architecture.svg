<tspan x="1187.5" dy="0" font-size="24" font-weight="700" fill="#9A3412">Skill Manager</tspan>
<tspan x="1187.5" dy="30" font-size="17" font-weight="500" fill="#111827">统一注册与编排</tspan>
<tspan x="1187.5" dy="30" font-size="17" font-weight="500" fill="#111827">生命周期 / 状态管理</tspan>
</text>
</g>
