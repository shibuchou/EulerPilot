<rect x="675" y="778" width="570" height="38" rx="19" fill="#EFF6FF" stroke="#BFDBFE"/>
<text x="960" y="803" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E3A8A">资源调度、网络与安全策略反馈</text>
