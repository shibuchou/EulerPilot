  <marker id="arrowOrange" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 14 7 L 0 14 z" fill="#EA580C"/></marker>
</defs>
<rect width="1920" height="1080" fill="#F8FAFC"/>
<text x="960" y="62" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="36" font-weight="800" fill="#0F172A">EulerPilot 简化架构图：观测、决策、执行与反馈闭环</text>
<text x="960" y="104" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="20" font-weight="500" fill="#475569">Workload → Kernel Observation → Agent Core → Adaptive Decision → Skill Manager → Kernel Execution → Workload</text>
