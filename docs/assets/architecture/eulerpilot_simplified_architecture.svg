<tspan x="677.5" dy="0" font-size="24" font-weight="700" fill="#9A3412">Agent Core</tspan>
<tspan x="677.5" dy="30" font-size="17" font-weight="500" fill="#111827">Runtime / Observer Reader</tspan>
<tspan x="677.5" dy="30" font-size="17" font-weight="500" fill="#111827">Workload Analyzer</tspan>
</text>
</g>
<g id="decision">
