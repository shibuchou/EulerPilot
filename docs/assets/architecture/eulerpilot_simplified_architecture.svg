<g id="legend"><rect x="460" y="945" width="1000" height="70" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/><path d="M 520 982 L 610 982" stroke="#1F2937" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="625" y="988" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="18" fill="#334155">实线：运行时数据流、决策流、执行流</text><path d="M 965 982 L 1055 982" stroke="#EA580C" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 8" marker-end="url(#arrowOrange)"/><text x="1070" y="988" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="18" fill="#334155">虚线：安全约束与反馈关系</text></g>
