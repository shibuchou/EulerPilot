<tspan x="167.5" dy="30" font-size="17" font-weight="500" fill="#111827">Redis / Nginx / Batch Jobs</tspan>
<tspan x="167.5" dy="30" font-size="17" font-weight="500" fill="#111827">Containers / K8s Pods</tspan>
</text>
