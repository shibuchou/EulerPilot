  <text x="1442.5" y="335" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" dominant-baseline="middle">
<tspan x="1442.5" dy="0" font-size="24" font-weight="700" fill="#166534">执行 Skills</tspan>
<tspan x="1442.5" dy="30" font-size="17" font-weight="500" fill="#111827">Resource Control / Scheduling</tspan>
<tspan x="1442.5" dy="30" font-size="17" font-weight="500" fill="#111827">Network / Security</tspan>
</text>
</g>
<g id="kernel">
  <rect x="1590" y="300" width="215" height="124" rx="16" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1697.5" y="335" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" dominant-baseline="middle">
<tspan x="1697.5" dy="0" font-size="24" font-weight="700" fill="#312E81">内核执行面</tspan>
<tspan x="1697.5" dy="30" font-size="17" font-weight="500" fill="#111827">cgroup v2 / sched_ext</tspan>
<tspan x="1697.5" dy="30" font-size="17" font-weight="500" fill="#111827">Network / Security Hooks</tspan>
</text>
</g>
<g id="safety">
  <rect x="810" y="560" width="780" height="124" rx="18" fill="#FFF1F2" stroke="#E11D48" stroke-width="2.5" filter="url(#softShadow)"/>
  <text x="1200.0" y="595" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" dominant-baseline="middle">
<tspan x="1200.0" dy="0" font-size="24" font-weight="700" fill="#9F1239">横切安全、事务与恢复</tspan>
<tspan x="1200.0" dy="30" font-size="18" font-weight="500" fill="#111827">Capability Detection / Ownership Guard / Transaction</tspan>
