<tspan x="677.5" dy="30" font-size="17" font-weight="500" fill="#111827">CLI / Web Console</tspan>
<tspan x="677.5" dy="30" font-size="17" font-weight="500" fill="#111827">Config / Policy</tspan>
</text>
</g>
