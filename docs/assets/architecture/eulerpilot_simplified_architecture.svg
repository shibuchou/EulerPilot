<tspan x="422.5" dy="30" font-size="17" font-weight="500" fill="#111827">eBPF / PSI</tspan>
<tspan x="422.5" dy="30" font-size="17" font-weight="500" fill="#111827">cgroup state</tspan>
</text>
</g>
