schema_version: 2
skills:
- name: resource_control
  kind: runtime
  enabled: true
  config:
    mode: enforce
    controllers:
      cpu:
        max:
          enabled: true
      memory:
        enabled: true
        high:
          enabled: true
        low:
          enabled: true
        max:
          enabled: true
        reclaim:
          enabled: false
      io:
        enabled: false
        weight:
          enabled: false
        max:
          enabled: false
    targets:
      real_container:
        type: container
        container_name: eulerpilot-rc-real-runtime
        runtime: podman
        cgroup_root: /sys/fs/cgroup
        docker_path: /usr/bin/podman
        podman_path: /usr/bin/podman
        isula_path: /usr/bin/podman
    profiles:
      background:
        target_ref: real_container
        normal:
          cpu_max: max
          memory_high: max
        pressure:
          target_ref: real_container
          cpu_max: '10000 100000'
          memory_high: '1048576'
          memory_low: '0'
          memory_max: max
- name: psi_gate
  kind: runtime
  enabled: true
  config: {}
