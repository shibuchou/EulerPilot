schema_version: 2
skills:
- name: resource_control
  kind: runtime
  enabled: true
  config:
    mode: audit
    controllers:
      cpu:
        max:
          enabled: false
      memory:
        enabled: false
        reclaim:
          enabled: false
      io:
        enabled: false
        weight:
          enabled: false
        max:
          enabled: false
    targets:
      background_cgroup:
        type: cgroup
        cgroup_path: /sys/fs/cgroup/eulerpilot/background
    profiles:
      background:
        target_ref: background_cgroup
        normal:
          cpu_max: max
          memory_high: max
        pressure:
          target_ref: background_cgroup
          cpu_max: max
          memory_high: max
- name: psi_gate
  kind: runtime
  enabled: true
  config: {}
- name: network_qos
  kind: runtime
  enabled: true
  config:
    targets:
      lab_pod:
        type: k8s_pod
        namespace: eulerpilot-lab
        pod_name: eulerpilot-rc-pod

        kubectl_path: /root/EulerPilot/results/network_policy/real-pod-veth-qos-20260630-k3s-122-v1/kubectl-wrapper
        crictl_path: /root/EulerPilot/results/network_policy/real-pod-veth-qos-20260630-k3s-122-v1/crictl-wrapper
        lab_namespace: eulerpilot-lab
        require_runtime_socket: false
    rules:
      - name: tc-egress-qos-lab-pod
        hook: tc_egress
        mode: enforce
        target_ref: lab_pod
        protocol: any
        dst_port: '0'
        rate: 1mbit
        burst: 32kb
        latency: 50ms
        action: limit
