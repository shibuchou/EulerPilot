apiVersion: v1
kind: Namespace
metadata:
  name: eulerpilot-sp4-validation
  labels:
    app.kubernetes.io/part-of: eulerpilot-validation
    eulerpilot.io/owner: web-console
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eulerpilot-k8s-smoke
  namespace: eulerpilot-sp4-validation
  labels:
    app.kubernetes.io/name: eulerpilot-k8s-smoke
    app.kubernetes.io/part-of: eulerpilot-validation
    eulerpilot.io/owner: web-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eulerpilot-k8s-smoke
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eulerpilot-k8s-smoke
        app.kubernetes.io/part-of: eulerpilot-validation
        eulerpilot.io/owner: web-console
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker1
      containers:
      - name: smoke
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "mkdir -p /www && echo ok > /www/health && httpd -f -p 8080 -h /www"]
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: eulerpilot-k8s-smoke
  namespace: eulerpilot-sp4-validation
  labels:
    app.kubernetes.io/name: eulerpilot-k8s-smoke
    app.kubernetes.io/part-of: eulerpilot-validation
    eulerpilot.io/owner: web-console
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: eulerpilot-k8s-smoke
  ports:
  - name: http
    port: 8080
    targetPort: 8080
