schema_version: 2
skills:
- name: resource_control
  kind: runtime
  enabled: true
  config: {}
- name: psi_gate
  kind: runtime
  enabled: true
  config: {}
- name: security_policy
  kind: runtime
  enabled: true
  config:
    mode: enforce
    targets:
      container_secret:
        type: container_id
        container_id: epcontainer276512abcdef
        cgroup_root: /sys/fs/cgroup/eulerpilot
        path: /tmp/eulerpilot-security-policy.Q3K3zf/dynamic-scoped-secret.txt
        exec_path: /tmp/eulerpilot-security-policy.Q3K3zf/dynamic-scoped-deny-exec.sh
    rules:
      - name: deny_container_secret_open
        hook: lsm_file_open
        target_ref: container_secret
        action: deny
