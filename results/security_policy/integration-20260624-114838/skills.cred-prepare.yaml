schema_version: 2
skills:
- name: resource_control
  kind: runtime
  enabled: true
  config: {}
- name: psi_gate
  kind: runtime
  enabled: true
  config: {}
- name: security_policy
  kind: runtime
  enabled: true
  config:
    mode: enforce
    targets:
      cred_prepare_scope:
        type: cgroup
        cgroup_path: /sys/fs/cgroup/eulerpilot/security-scope-358807
    rules:
      - name: deny_cred_prepare
        hook: lsm_cred_prepare
        target_ref: cred_prepare_scope
        action: deny
