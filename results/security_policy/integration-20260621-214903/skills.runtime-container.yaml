schema_version: 2
skills:
- name: resource_control
  kind: runtime
  enabled: true
  config: {}
- name: psi_gate
  kind: runtime
  enabled: true
  config: {}
- name: security_policy
  kind: runtime
  enabled: true
  config:
    mode: enforce
    targets:
      runtime_secret:
        type: container
        container_name: eulerpilot-runtime-257282
        runtime: crictl
        crictl_path: /tmp/eulerpilot-security-policy.M0GydA/fake-crictl
        cgroup_root: /sys/fs/cgroup/eulerpilot
        path: /tmp/eulerpilot-security-policy.M0GydA/dynamic-scoped-secret.txt
        exec_path: /tmp/eulerpilot-security-policy.M0GydA/dynamic-scoped-deny-exec.sh
    rules:
      - name: deny_runtime_secret_open
        hook: lsm_file_open
        target_ref: runtime_secret
        action: deny
