schema_version: 2
skills:
- name: resource_control
  kind: runtime
  enabled: true
  config: {}
- name: psi_gate
  kind: runtime
  enabled: true
  config: {}
- name: security_policy
  kind: runtime
  enabled: true
  config:
    mode: enforce
    targets:
      socket_scope:
        type: cgroup
        cgroup_path: /sys/fs/cgroup/eulerpilot/security-scope-312305
        dst_ip: 127.0.0.1
        dst_port: 19305
    rules:
      - name: deny_socket_connect
        hook: lsm_socket_connect
        target_ref: socket_scope
        action: deny
