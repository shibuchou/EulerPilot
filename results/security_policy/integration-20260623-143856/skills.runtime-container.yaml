schema_version: 2
skills:
- name: resource_control
  kind: runtime
  enabled: true
  config: {}
- name: psi_gate
  kind: runtime
  enabled: true
  config: {}
- name: security_policy
  kind: runtime
  enabled: true
  config:
    mode: enforce
    targets:
      runtime_secret:
        type: container
        container_name: eulerpilot-runtime-312305
        runtime: crictl
        crictl_path: /tmp/eulerpilot-security-policy.YVsxaR/fake-crictl
        cgroup_root: /sys/fs/cgroup/eulerpilot
        path: /tmp/eulerpilot-security-policy.YVsxaR/dynamic-scoped-secret.txt
        exec_prefix: /tmp/eulerpilot-security-policy.YVsxaR/
    rules:
      - name: deny_runtime_secret_open
        hook: lsm_file_open
        target_ref: runtime_secret
        action: deny
      - name: deny_runtime_exec
        hook: lsm_bprm_check_security
        target_ref: runtime_secret
        action: deny
