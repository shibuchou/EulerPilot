schema_version: 2
skills:
- name: resource_control
  kind: runtime
  enabled: true
  config: {}
- name: psi_gate
  kind: runtime
  enabled: true
  config: {}
- name: security_policy
  kind: runtime
  enabled: true
  config:
    mode: enforce
    targets:
      setgroups_scope:
        type: cgroup
        cgroup_path: /sys/fs/cgroup/eulerpilot/security-scope-220425
    rules:
      - name: deny_setgroups_transition
        hook: lsm_task_fix_setgroups
        target_ref: setgroups_scope
        action: deny
