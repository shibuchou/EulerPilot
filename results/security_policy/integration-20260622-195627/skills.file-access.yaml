schema_version: 2
skills:
- name: resource_control
  kind: runtime
  enabled: true
  config: {}
- name: psi_gate
  kind: runtime
  enabled: true
  config: {}
- name: security_policy
  kind: runtime
  enabled: true
  config:
    mode: enforce
    targets:
      write_secret:
        type: cgroup
        cgroup_path: /sys/fs/cgroup/eulerpilot/security-scope-196272
        path: /tmp/eulerpilot-security-policy.QhnFed/write-only-target.txt
        file_access: write
    rules:
      - name: deny_write_open
        hook: lsm_file_open
        target_ref: write_secret
        action: deny
