schema_version: 2
skills:
- name: resource_control
  kind: runtime
  enabled: true
  config: {}
- name: psi_gate
  kind: runtime
  enabled: true
  config: {}
- name: security_policy
  kind: runtime
  enabled: true
  config:
    mode: enforce
    targets:
      scoped_secret:
        type: path
        path: /tmp/eulerpilot-security-policy.aHgPpq/dynamic-scoped-secret.txt
        exec_path: /tmp/eulerpilot-security-policy.aHgPpq/dynamic-scoped-deny-exec.sh
        cgroup_path: /sys/fs/cgroup/eulerpilot/security-scope-188005
    rules:
      - name: deny_scoped_secret_open
        hook: lsm_file_open
        target_ref: scoped_secret
        action: deny
