schema_version: 2
skills:
- name: resource_control
  kind: runtime
  enabled: true
  config: {}
- name: psi_gate
  kind: runtime
  enabled: true
  config: {}
- name: security_policy
  kind: runtime
  enabled: true
  config:
    mode: enforce
    targets:
      pid_secret:
        type: pid
        pid: 188331
        path: /tmp/eulerpilot-security-policy.aHgPpq/dynamic-scoped-secret.txt
        exec_path: /tmp/eulerpilot-security-policy.aHgPpq/dynamic-scoped-deny-exec.sh
    rules:
      - name: deny_pid_secret_open
        hook: lsm_file_open
        target_ref: pid_secret
        action: deny
