schema_version: 2
skills:
- name: resource_control
  kind: runtime
  enabled: true
  config: {}
- name: psi_gate
  kind: runtime
  enabled: true
  config: {}
- name: security_policy
  kind: runtime
  enabled: true
  config:
    mode: enforce
    targets:
      readonly_dir:
        type: cgroup
        cgroup_path: /sys/fs/cgroup/eulerpilot/security-scope-337023
        path_prefix: /tmp/eulerpilot-security-policy.XHyxPL/read-only-dir/
        file_access: write
    rules:
      - name: deny_readonly_dir_write
        hook: lsm_file_open
        target_ref: readonly_dir
        action: deny
