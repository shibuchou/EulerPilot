schema_version: 2
skills:
- name: resource_control
  kind: runtime
  enabled: true
  config: {}
- name: psi_gate
  kind: runtime
  enabled: true
  config: {}
- name: security_policy
  kind: runtime
  enabled: true
  config:
    mode: enforce
    targets:
      pid_secret:
        type: pid
        pid: 318315
        path: /tmp/eulerpilot-security-policy.nApMXU/dynamic-scoped-secret.txt
        exec_prefix: /tmp/eulerpilot-security-policy.nApMXU/
    rules:
      - name: deny_pid_secret_open
        hook: lsm_file_open
        target_ref: pid_secret
        action: deny
      - name: deny_pid_exec
        hook: lsm_bprm_check_security
        target_ref: pid_secret
        action: deny
