schema_version: 2
skills:
- name: resource_control
  kind: runtime
  enabled: true
  config: {}
- name: psi_gate
  kind: runtime
  enabled: true
  config: {}
- name: security_policy
  kind: runtime
  enabled: true
  config:
    mode: enforce
    targets:
      ptrace_scope:
        type: cgroup
        cgroup_path: /sys/fs/cgroup/eulerpilot/security-scope-200563
    rules:
      - name: deny_ptrace_traceme
        hook: lsm_ptrace_traceme
        target_ref: ptrace_scope
        action: deny
