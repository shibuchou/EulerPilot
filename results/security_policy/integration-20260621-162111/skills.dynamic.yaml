schema_version: 2
skills:
- name: resource_control
  kind: runtime
  enabled: true
  config: {}
- name: psi_gate
  kind: runtime
  enabled: true
  config: {}
- name: security_policy
  kind: runtime
  enabled: true
  config:
    mode: enforce
    targets:
      dynamic_secret:
        type: path
        path: /tmp/eulerpilot-security-policy.ejs0n1/dynamic-secret.txt
        exec_path: /tmp/eulerpilot-security-policy.ejs0n1/dynamic-deny-exec.sh
    rules:
      - name: deny_dynamic_secret_open
        hook: lsm_file_open
        target_ref: dynamic_secret
        action: deny
