schema_version: 2
skills:
- name: resource_control
  kind: runtime
  enabled: true
  config: {}
- name: psi_gate
  kind: runtime
  enabled: true
  config: {}
- name: security_policy
  kind: runtime
  enabled: true
  config:
    mode: enforce
    targets:
      scoped_secret:
        type: path
        path: /tmp/eulerpilot-security-policy.yeju51/dynamic-scoped-secret.txt
        exec_prefix: /tmp/eulerpilot-security-policy.yeju51/
        cgroup_path: /sys/fs/cgroup/eulerpilot/security-scope-207123
    rules:
      - name: deny_scoped_secret_open
        hook: lsm_file_open
        target_ref: scoped_secret
        action: deny
      - name: deny_scoped_exec
        hook: lsm_bprm_check_security
        target_ref: scoped_secret
        action: deny
