schema_version: 2
skills:
- name: resource_control
  kind: runtime
  enabled: true
  config:
    mode: audit
    controllers:
      cpu:
        max:
          enabled: true
      memory:
        enabled: true
        high:
          enabled: true
        low:
          enabled: true
        max:
          enabled: true
        reclaim:
          enabled: false
      io:
        enabled: false
        weight:
          enabled: false
        max:
          enabled: false
- name: security_policy
  kind: runtime
  enabled: true
  config:
    mode: audit
    targets:
      demo_secret:
        type: path
        path: /root/EulerPilot/demo/security_policy_demo/secret.txt
        exec_path: /root/EulerPilot/demo/security_policy_demo/deny_exec.sh
    rules:
      - name: deny_demo_secret_open
        hook: lsm_file_open
        target_ref: demo_secret
        action: deny
      - name: deny_demo_exec
        hook: lsm_bprm_check_security
        target_ref: demo_secret
        action: deny
    anomaly_rules:
      - name: burst_execve
        type: rate
        syscall: execve
        threshold: 4
        window_ms: 2000
        severity: medium
- name: policy_engine
  kind: runtime
  enabled: true
  config:
    mode: enforce
    source:
      audit_path: reports/events/security_policy.jsonl
    watch:
      skill: security_policy
      operation: anomaly
      rule_id: burst_execve
      result: observed
    targets:
      anomaly_background:
        type: cgroup
        path: /sys/fs/cgroup/eulerpilot/policy-engine-background
    actions:
      - name: throttle_anomaly_background_cpu
        target_ref: anomaly_background
        file: cpu.max
        value: '10000 100000'
      - name: cap_anomaly_background_memory
        target_ref: anomaly_background
        file: memory.high
        value: '1048576'
