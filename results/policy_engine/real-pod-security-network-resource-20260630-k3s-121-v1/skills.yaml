schema_version: 2
skills:
- name: resource_control
  kind: runtime
  enabled: true
  config:
    mode: audit
    controllers:
      cpu:
        max:
          enabled: true
      memory:
        enabled: true
        high:
          enabled: true
        low:
          enabled: true
        max:
          enabled: true
        reclaim:
          enabled: false
      io:
        enabled: false
        weight:
          enabled: false
        max:
          enabled: false
- name: network_qos
  kind: runtime
  enabled: true
  config:
    mode: audit
    targets:
      lab_pod:
        type: k8s_pod
        namespace: eulerpilot-lab
        pod_name: eulerpilot-rc-pod

        kubectl_path: /root/EulerPilot/results/policy_engine/real-pod-security-network-resource-20260630-k3s-121-v1/kubectl-wrapper
        crictl_path: /root/EulerPilot/results/policy_engine/real-pod-security-network-resource-20260630-k3s-121-v1/crictl-wrapper
        lab_namespace: eulerpilot-lab
        require_runtime_socket: false
    rules:
      - name: policy_engine_real_pod_qos_guard
        hook: tc_egress
        target_ref: lab_pod
        protocol: any
        dst_port: '0'
        rate: 2mbit
        burst: 32kb
        latency: 50ms
        action: limit
- name: security_policy
  kind: runtime
  enabled: true
  config:
    mode: audit
    targets:
      lab_connect:
        type: path
        dst_ip: 127.0.0.1
        dst_port: '65000'
    rules:
      - name: observe_lab_connect
        hook: lsm_socket_connect
        target_ref: lab_connect
        action: deny
    anomaly_rules:
      - name: burst_connect
        type: rate
        syscall: connect
        threshold: 3
        window_ms: 1000
        severity: high
- name: policy_engine
  kind: runtime
  enabled: true
  config:
    mode: enforce
    policy_id: security_network_resource_real_pod_response
    source:
      audit_path: reports/events/security_policy.jsonl
    watch:
      skill: security_policy
      operation: anomaly
      rule_id: burst_connect
      result: observed
    dependencies:
      security_policy: true
      resource_control: true
      network_qos: true
    guards:
      memory_high: true
    targets:
      lab_pod:
        type: k8s_pod
        namespace: eulerpilot-lab
        pod_name: eulerpilot-rc-pod

        kubectl_path: /root/EulerPilot/results/policy_engine/real-pod-security-network-resource-20260630-k3s-121-v1/kubectl-wrapper
        crictl_path: /root/EulerPilot/results/policy_engine/real-pod-security-network-resource-20260630-k3s-121-v1/crictl-wrapper
        lab_namespace: eulerpilot-lab
        require_runtime_socket: false
    actions:
      - name: throttle_real_pod_cpu
        target_ref: lab_pod
        file: cpu.max
        value: '20000 100000'
      - name: cap_real_pod_memory
        target_ref: lab_pod
        file: memory.high
        value: '134217728'
      - name: limit_real_pod_veth
        target_ref: lab_pod
        file: network_qos.rate
        value: 2mbit
        burst: 32kb
        latency: 50ms
